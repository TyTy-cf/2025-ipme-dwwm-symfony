services:
    php:
        build:
            dockerfile: Dockerfile
            target: php
        volumes:
            - ./:/var/www/html

    caddy:
        build:
            dockerfile: Dockerfile
            target: caddy
        restart: unless-stopped
        cap_add:
            - NET_ADMIN
        ports:
            - 8443:8443
        volumes:
            - ./:/var/www/html
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - php

    mariadb:
        image: mariadb:11.5.2
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: db_steamish
        ports:
            - 3306:3306
        volumes:
            - mariadb:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: always
        ports:
            - 8080:80
        environment:
            PMA_HOST: mariadb
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
        depends_on:
            - mariadb

    node:
        image: node:20
        volumes:
            - ./:/var/www/html
        working_dir: /var/www/html
        tty: true

volumes:
    mariadb:
    caddy_data:
    caddy_config:
